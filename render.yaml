databases:
  # Free Render Postgres: same account, no extra signup. NOTE: Render deletes
  # free databases 30 days after creation (14-day grace to upgrade), so export
  # your data (pg_dump) or point DATABASE_URL at another Postgres before then.
  - name: votesphere-db
    plan: free
    databaseName: votesphere
    user: votesphere
    ipAllowList: [] # internal connections from the web service only

services:
  - type: web
    name: secure-vote-demo
    env: node
    plan: free
    # migrate deploy applies only the committed migrations and never drops data
    # (unlike `db push --accept-data-loss`), which matters now that the
    # database persists.
    buildCommand: npm install && npm install --prefix server && cd server && npx prisma generate && npx prisma migrate deploy && cd .. && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Wired automatically from the database above, so no password is ever
      # copied by hand. Any other Postgres works too: just set DATABASE_URL.
      - key: DATABASE_URL
        fromDatabase:
          name: votesphere-db
          property: connectionString
      # Generated once by Render and kept across deploys. Changing JWT_SECRET
      # invalidates admin logins and voting codes, and the server will refuse to
      # start if ballots exist (the election key is encrypted under it).
      - key: JWT_SECRET
        generateValue: true
      # Needed once to register the first admin. Find it in the Render dashboard
      # under Environment, or replace it with any value you prefer.
      - key: ADMIN_SETUP_KEY
        generateValue: true
